<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ollama 이미지 생성</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="/css/springai.css" rel="stylesheet">
  <script src="/js/springai.js"></script>
  <script>
    async function handleSubmit() {
      const description = document.getElementById('description').value.trim();
      if (!description) {
        alert('생성할 이미지 설명을 입력해 주세요.');
        return;
      }

      springai.setSpinner('spinner', true);

      try {
        const response = await fetch('/ai/image-generate', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/x-www-form-urlencoded',
            'Accept': 'text/plain'
          },
          body: new URLSearchParams({ description })
        });

        if (!response.ok) {
          throw new Error(await response.text());
        }

        // 서버가 반환한 Base64 문자열을 이미지 데이터 URL로 변환한다.
        const base64 = await response.text();
        const imageSource = `data:image/png;base64,${base64}`;
        document.getElementById('generatedImage').src = imageSource;
        document.getElementById('downloadLink').href = imageSource;
        document.getElementById('downloadLink').classList.remove('d-none');
      } catch (error) {
        alert(`이미지 생성 실패: ${error.message}`);
      } finally {
        springai.setSpinner('spinner', false);
      }
    }
  </script>
</head>
<body>
  <div class="d-flex flex-column vh-100">
    <nav class="navbar justify-content-between">
      <a href="/" class="navbar-brand ps-2">
        <img src="/image/spring_ai_logo_with_text.svg" width="200" alt="Spring AI">
      </a>
      <div id="spinner" class="spinner-border text-success d-none me-3" role="status">
        <span class="visually-hidden">Loading...</span>
      </div>
    </nav>

    <main class="flex-grow-1 container py-4 overflow-auto">
      <h2>Ollama 이미지 생성</h2>
      <p class="text-secondary">Ollama 이미지 생성 모델로 1024×1024 이미지를 만듭니다.</p>
      <textarea id="description" class="form-control" rows="5"
                placeholder="예: 봄날의 서울을 걷는 귀여운 로봇, 따뜻한 수채화 스타일"></textarea>
      <button type="button" class="btn btn-primary mt-3" onclick="handleSubmit()">이미지 생성</button>
      <a id="downloadLink" class="btn btn-outline-success mt-3 ms-2 d-none"
         download="ollama-generated.png">다운로드</a>

      <div class="text-center mt-4">
        <img id="generatedImage" src="/image/assistant.png" class="img-fluid rounded"
             style="max-height: 620px" alt="생성된 이미지">
      </div>
    </main>
  </div>
</body>
</html>
