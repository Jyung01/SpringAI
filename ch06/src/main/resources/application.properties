spring.application.name=ch06

# ChatModel을 Ollama로 선택
spring.ai.model.chat=ollama

# ImageModel만 OpenAI로 선택(대화 모델은 위 설정에 따라 계속 Ollama 사용)
spring.ai.model.image=openai

spring.ai.ollama.base-url=${OLLAMA_BASE_URL:http://100.64.80.110:11434}

# 텍스트 대화와 이미지/동영상 분석을 함께 처리하는 Ollama 비전 모델
spring.ai.ollama.chat.model=${OLLAMA_VISION_MODEL:qwen3.5:9b}
spring.ai.ollama.chat.temperature=0.3
spring.ai.ollama.chat.num-ctx=8192
spring.ai.ollama.chat.think=false

# OpenAI는 이미지 생성에만 사용한다. API 키를 소스에 직접 저장하지 않는다.
spring.ai.openai.api-key=${OPENAI_API_KEY}
spring.ai.openai.image.model=${OPENAI_IMAGE_MODEL:gpt-image-1-mini}
spring.ai.openai.image.n=1
spring.ai.openai.image.size=1024x1024
spring.ai.openai.image.response-format=b64_json

# 정적 콘텐츠 캐시 설정
spring.web.resources.cache.cachecontrol.no-cache=true
spring.web.resources.cache.cachecontrol.no-store=true
spring.web.resources.cache.cachecontrol.must-revalidate=true

# Thymeleaf 캐시 설정
spring.thymeleaf.cache=false
