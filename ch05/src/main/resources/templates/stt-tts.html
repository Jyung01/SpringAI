<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>STT / TTS 테스트</title>
    <link href="/css/springai.css" rel="stylesheet">
    <script src="/js/ollama-voice.js"></script>
    <style>
        body { width: min(800px, calc(100% - 32px)); margin: 28px auto; font-family: sans-serif; }
        section { padding: 20px; margin: 20px 0; border: 1px solid #ddd; border-radius: 12px; }
        textarea { width: 100%; min-height: 110px; box-sizing: border-box; padding: 12px; }
        button { margin-top: 10px; padding: 10px 16px; cursor: pointer; }
        #status { color: #126b45; }
    </style>
</head>
<body>
    <a href="/">← 목록</a>
    <h1>STT / TTS 테스트</h1>
    <p id="status">Chrome 또는 Edge에서 마이크 권한을 허용해 주세요.</p>

    <section>
        <h2>Speech To Text</h2>
        <button id="recordButton" type="button">음성 인식 시작</button>
        <textarea id="recognizedText" placeholder="인식된 문장이 표시됩니다."></textarea>
    </section>

    <section>
        <h2>Text To Speech</h2>
        <textarea id="ttsText" placeholder="읽을 문장을 입력하세요.">안녕하세요. 브라우저 음성 읽기 테스트입니다.</textarea>
        <button id="speakButton" type="button">음성 재생</button>
        <button id="stopButton" type="button">재생 중지</button>
    </section>

    <script>
        const statusElement = document.getElementById('status');
        const recognizedText = document.getElementById('recognizedText');

        document.getElementById('recordButton').addEventListener('click', () => {
            ollamaVoice.recognize({
                onStart: () => statusElement.textContent = '말씀해 주세요...',
                onResult: text => {
                    recognizedText.value = text;
                    statusElement.textContent = '음성 인식이 완료되었습니다.';
                },
                onError: message => statusElement.textContent = message
            });
        });

        document.getElementById('speakButton').addEventListener('click', () => {
            ollamaVoice.speak(document.getElementById('ttsText').value);
        });

        document.getElementById('stopButton').addEventListener('click', ollamaVoice.stopSpeaking);
    </script>
</body>
</html>
