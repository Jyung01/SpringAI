spring.application.name=ch11

spring.ai.model.chat=ollama
spring.ai.model.embedding=ollama
spring.ai.ollama.base-url=${OLLAMA_BASE_URL:http://100.64.80.110:11434}
spring.ai.ollama.chat.model=${OLLAMA_CHAT_MODEL:qwen3.5:9b}
spring.ai.ollama.chat.temperature=0.3
spring.ai.ollama.chat.num-ctx=8192

# Qwen의 Thinking 출력을 끄고 일반 답변만 생성
spring.ai.ollama.chat.think=false

# SimpleLoggerAdvisor의 요청/응답 로그를 출력
logging.level.org.springframework.ai.chat.client.advisor=DEBUG

# JDBC 세팅
spring.datasource.url=jdbc:postgresql://localhost:5432/postgres
spring.datasource.username=postgres
spring.datasource.password=1234

# PGVector 설정
spring.ai.vectorstore.pgvector.initialize-schema=true
spring.ai.vectorstore.pgvector.schema-name=public
spring.ai.vectorstore.pgvector.table-name=vector_store
spring.ai.vectorstore.pgvector.index-type=HNSW

# Embedding 설정
spring.ai.ollama.embedding.model=qwen3-embedding:0.6b
spring.ai.ollama.embedding.truncate=true