<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>ListOutputConverter</title>
  <style>
    body {
      width: 800px;
      margin: 20px auto;
    }

    #chatPanel {
      height: 500px;
      border: 1px solid #ccc;
      padding: 10px;
      overflow-y: auto;
      margin-bottom: 10px;
    }

    .user {
      text-align: right;
      margin: 10px 0;
    }

    .user .bubble {
      display: inline-block;
      background-color: #d1e7ff;
      padding: 10px;
      border-radius: 10px;
      max-width: 70%;
    }

    .ai {
      text-align: left;
      margin: 10px 0;
    }

    .ai .bubble {
      display: inline-block;
      background-color: #f1f1f1;
      padding: 10px;
      border-radius: 10px;
      max-width: 70%;
    }

    textarea {
      width: 100%;
      height: 80px;
      box-sizing: border-box;
    }

    button {
      margin-top: 10px;
      padding: 8px 20px;
    }
  </style>

  <script>
    async function handleSubmit() {

      const questionElement = document.getElementById("question");
      const question = questionElement.value.trim();

      if (!question) return;

      const chatPanel = document.getElementById("chatPanel");

      // 사용자 질문 추가
      chatPanel.innerHTML += `
        <div class="user">
            <div class="bubble">${escapeHtml(question)}</div>
        </div>
    `;

      questionElement.value = "";

      // AI 답변 자리 생성
      const answerId = "answer-" + Date.now();

      chatPanel.innerHTML += `
        <div class="ai">
            <div id="${answerId}" class="bubble">
                응답 생성 중...
            </div>
        </div>
    `;

      chatPanel.scrollTop = chatPanel.scrollHeight;

      const response = await fetch('/ai/list-output-converter', {
        method: "post",
        headers: {
          'Content-Type': 'application/x-www-form-urlencoded',
          'Accept': 'application/json'
        },
        body: new URLSearchParams({ city: question })
      });

      const reader = response.body.getReader();
      const decoder = new TextDecoder();

      const answerElement = document.getElementById(answerId);

      answerElement.innerText = "";

      while (true) {

        const { done, value } = await reader.read();

        if (done) {
          break;
        }

        const chunk = decoder.decode(value, { stream: true });

        answerElement.innerText += chunk;

        chatPanel.scrollTop = chatPanel.scrollHeight;
      }
    }

    function escapeHtml(text) {
      const div = document.createElement("div");
      div.innerText = text;
      return div.innerHTML;
    }
  </script>

</head>
<body>
  <h3>ListOutputConverter</h3>
  <div id="chatPanel"></div>
  <textarea id="question" placeholder="도시 이름을 입력하세요."></textarea>
  <button onclick="handleSubmit()">질문하기</button>
  </body>
</html>
